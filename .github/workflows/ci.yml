name: CPU CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-tests:
    name: Lint, type-check and tests on CPU
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU-only PyTorch, package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          # Index torch from the PyTorch CPU wheel repository to keep CI CPU-only.
          python -m pip install "torch>=2.3" --index-url https://download.pytorch.org/whl/cpu
          # torch is already satisfied above; remaining dev/runtime deps install from PyPI.
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: python -m ruff check lapis tests

      - name: Check formatting with ruff
        run: python -m ruff format --check lapis tests

      - name: Type-check with mypy
        run: python -m mypy lapis

      - name: Run test suite (CPU only)
        run: python -m pytest -q

  package-build:
    name: Build package and smoke-test installability
    needs: lint-and-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Install CPU-only PyTorch and light dev dependencies
        run: |
          python -m pip install --upgrade pip
          # Index torch from the PyTorch CPU wheel repository to keep CI CPU-only.
          python -m pip install "torch>=2.3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest ruff mypy build

      - name: Install the built wheel without pulling dependencies again
        run: python -m pip install dist/lapisllm-*.whl --no-deps --find-links dist

      - name: Smoke test the installed package
        run: |
          python -c "import lapis; print(lapis.__version__)"
          lapis doctor --json > /dev/null && echo "doctor JSON OK"

