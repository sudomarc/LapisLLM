name: Lapis website

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install website tooling
        working-directory: website
        run: npm ci
      - name: Lint website
        working-directory: website
        run: npm run lint
      - name: Build website
        working-directory: website
        run: npm run build

  deploy:
    name: Deploy LAPIS website to Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install website tooling
        working-directory: website
        run: npm ci
      - name: Build website artifact
        working-directory: website
        run: npm run build
      - name: Verify Pages artifact
        working-directory: website
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f 404.html
          test -f sitemap.xml
          test -f robots.txt
          test -f manifest.webmanifest
          test -f favicon.svg
          test -f styles.css
          test -f script.js
          test -f data.js
          test -f models/index.html
          test -f skills/index.html
          test -f docs/index.html
          test -f research/index.html
          test -f roadmap/index.html
          test -f changelog/index.html
          test -f about/index.html
          test -f models/lapis-tiny/index.html
          test -f models/lapis-small/index.html
          test -f models/lapis-1b/index.html
          test -f models/lapis-3b/index.html
          test -f models/lapis-7b/index.html
          echo "GitHub Pages artifact preflight passed."
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './website'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
