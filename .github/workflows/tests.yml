name: Lapis tests

on:
  push:
    branches: ["main", "maintenance/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run tests with coverage
        run: python -m pytest --cov=lapis --cov-report=term-missing --cov-report=xml

      - name: Run tiny training smoke test
        run: python -m scripts.train --config configs/tiny.yaml --epochs 1 --device cpu

      - name: Run evaluation smoke test
        run: python -m scripts.evaluate --checkpoint checkpoints/latest.pt --device cpu

      - name: Ruff check
        run: ruff check .

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist

      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())

          required = {
              "lapis/__init__.py",
              "scripts/__init__.py",
              "scripts/train.py",
              "scripts/evaluate.py",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"Wheel is missing required files: {missing}")
          print(f"Wheel contents verified: {wheel.name}")
          PY

      - name: Verify non-editable installation
        run: |
          python -m venv --system-site-packages /tmp/lapis-wheel-check
          /tmp/lapis-wheel-check/bin/python -m pip install --no-deps dist/*.whl
          /tmp/lapis-wheel-check/bin/python -c "import lapis, scripts.train; print('non-editable import check passed')"

  security:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and audit tooling
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Dependency vulnerability audit
        run: python -m pip_audit

      - name: Working-tree secret scan
        shell: bash
        run: |
          set -euo pipefail
          pattern='(^|[^A-Za-z0-9])(gh[pousr]_[A-Za-z0-9_-]{20,}|github_pat_[A-Za-z0-9_]{30,}|sk-[A-Za-z0-9_-]{20,}|hf_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|xox[baprs]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)'
          if git grep -nE "$pattern" -- . ':(exclude).git'; then
            echo "Potential secret detected in tracked files." >&2
            exit 1
          fi

      - name: Git-history secret scan
        shell: bash
        run: |
          set -euo pipefail
          pattern='gh[pousr]_[A-Za-z0-9_-]{20,}|github_pat_[A-Za-z0-9_]{30,}|sk-[A-Za-z0-9_-]{20,}|hf_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|xox[baprs]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'
          matches="$(git log --all --patch --regexp-ignore-case -G "$pattern" -- || true)"
          if printf '%s\n' "$matches" | grep -qE '^\+.*(gh[pousr]_|github_pat_|sk-|hf_|AIza|xox[baprs]-|AKIA|BEGIN .*PRIVATE KEY)'; then
            echo "Potential secret detected in Git history." >&2
            exit 1
          fi
