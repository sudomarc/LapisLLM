name: Lapis tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Run tests
        run: python -m pytest

      - name: Run tiny training smoke test
        run: python scripts/train.py --config configs/tiny.yaml --epochs 1 --device cpu

      - name: Run evaluation smoke test
        run: python scripts/evaluate.py --checkpoint checkpoints/latest.pt --device cpu

      - name: Ruff check
        run: ruff check .
