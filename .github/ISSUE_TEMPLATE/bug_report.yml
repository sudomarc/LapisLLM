name: Bug report
description: Report a reproducible defect in LapisLLM.
title: "[BUG] "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, do not open a public issue. Follow SECURITY.md."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the smallest reproducible example and exact command.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, PyTorch, CUDA/GPU, commit SHA and config.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets, private data and private source code.
