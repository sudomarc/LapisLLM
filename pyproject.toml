[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "lapis"
version = "0.1.0"
description = "Build your own Large Language Model from scratch"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "safetensors>=0.4.0",
    "pydantic>=2.5.0",
    "fastapi>=0.104.0",
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
train_tokenizer = "scripts.train_tokenizer:main"
prepare_data = "scripts.prepare_data:main"
train = "scripts.train:main"
evaluate = "scripts.evaluate:main"
generate = "scripts.generate:main"
chat = "scripts.chat:main"
serve = "scripts.serve:main"

[tool.pytest]
addopts = []

[tool.ruff]
line-length = 88