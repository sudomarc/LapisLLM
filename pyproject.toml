[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "lapis"
version = "0.1.1"
description = "LAPIS language model and training stack from scratch"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.11.0,<3.0.0",
    "pydantic>=2.13.5",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "pyyaml>=6.0.0",
    "tokenizers>=0.23.2",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "psutil>=7.2.2",
    "textual>=8.2.8,<9.0.0",
]

[project.optional-dependencies]
data = [
    "datasets>=5.0.1",
    "requests>=2.31.0",
]
dev = [
    "coverage>=7.10.6",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.16.6",
]

[project.scripts]
lapis = "lapis.cli:app"
train_tokenizer = "scripts.train_tokenizer:main"
prepare_data = "scripts.prepare_data:main"
train = "scripts.train:main"
evaluate = "scripts.evaluate:main"
generate = "scripts.generate:main"
chat = "scripts.chat:main"
lapis-chat = "scripts.chat:main"
serve = "scripts.serve:main"
download_datasets = "scripts.download_datasets:main"

[tool.poetry]
include = [
    { path = "configs/*.yaml", format = "wheel" },
    { path = "configs/data/*.yaml", format = "wheel" },
    { path = "configs/user/*.yaml", format = "wheel" },
]

[tool.pytest]
addopts = []

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["F"]
