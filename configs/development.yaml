# Lapis development configuration

model:
  vocab_size: 50304
  hidden_size: 512
  intermediate_size: 1024
  num_layers: 4
  num_attention_heads: 8
  num_key_value_heads: 4
  max_position_embeddings: 1024
  rope_theta: 10000.0
  dropout: 0.1
  bias: true

training:
  learning_rate: 3e-4
  weight_decay: 0.1
  warmup_steps: 50
  max_steps: 500
  batch_size: 8
  micro_batch_size: 2
  gradient_accumulation_steps: 4
  gradient_clip: 1.0

runtime:
  dtype: "float16"
  device: "cuda"
  compile: false