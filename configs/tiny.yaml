# Lapis Small: compact enough for Colab/local experiments, but large enough to learn useful language structure.
model:
  vocab_size: 4096
  hidden_size: 256
  intermediate_size: 1024
  num_layers: 6
  num_attention_heads: 8
  num_key_value_heads: 4
  max_position_embeddings: 512
  rope_theta: 10000.0
  dropout: 0.0
  bias: true

tokenizer:
  path: "artifacts/tokenizer"
  vocab_size: 4096
  min_frequency: 2

training:
  learning_rate: 3e-4
  weight_decay: 0.1
  warmup_steps: 100
  max_steps: 3000
  batch_size: 8
  micro_batch_size: 4
  gradient_accumulation_steps: 2
  gradient_clip: 1.0

runtime:
  dtype: "float32"
  device: "auto"
  compile: false

data:
  dataset_name: "lapis-open-mixture"
  max_seq_length: 511
