# LapisLLM Colab GPU profile.
# Target: first real pretraining run on a typical 16 GB Colab GPU (e.g. T4).
# This is intentionally modest so the full stack can be validated before scaling.

model:
  vocab_size: 8192
  hidden_size: 512
  intermediate_size: 1376
  num_layers: 8
  num_attention_heads: 8
  num_key_value_heads: 4
  max_position_embeddings: 512
  rope_theta: 10000.0
  dropout: 0.0
  bias: true

tokenizer:
  path: artifacts/colab-tokenizer
  vocab_size: 8192
  min_frequency: 2

training:
  learning_rate: 0.0003
  weight_decay: 0.1
  warmup_steps: 500
  max_steps: 10000
  batch_size: 16
  micro_batch_size: 2
  gradient_accumulation_steps: 8
  gradient_clip: 1.0

runtime:
  dtype: float16
  device: cuda
  compile: false

data:
  max_seq_length: 511
