# Lapis Local Dev: tiny CPU-friendly configuration for pipeline development.
# The real model vocabulary is produced by the BPE tokenizer training step.
# Keep this vocabulary comfortably above the 256-byte ByteLevel alphabet.

model:
  vocab_size: 512
  hidden_size: 96
  intermediate_size: 256
  num_layers: 2
  num_attention_heads: 4
  num_key_value_heads: 2
  max_position_embeddings: 64
  rope_theta: 10000.0
  dropout: 0.0
  bias: true

tokenizer:
  path: artifacts/tokenizer
  vocab_size: 512
  min_frequency: 1

training:
  learning_rate: 0.001
  weight_decay: 0.01
  warmup_steps: 0
  max_steps: 100
  batch_size: 4
  micro_batch_size: 1
  gradient_accumulation_steps: 4
  gradient_clip: 1.0

runtime:
  dtype: float32
  device: cpu

data:
  dataset_name: "lapis-open-mixture"
  validation_split: 0.1
  # One extra token is retained by TextDataset for the causal target shift.
  max_seq_length: 63
