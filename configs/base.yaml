# Lapis base configuration
model:
  vocab_size: 50304
  hidden_size: 768
  intermediate_size: 2048
  num_layers: 24
  num_attention_heads: 12
  num_key_value_heads: 12
  max_position_embeddings: 8192
  rope_theta: 10000.0
  dropout: 0.0
  bias: true

training:
  learning_rate: 3e-4
  weight_decay: 0.1
  warmup_steps: 100
  max_steps: 10000
  batch_size: 128
  micro_batch_size: 128
  gradient_accumulation_steps: 1
  gradient_clip: 1.0

runtime:
  dtype: "bfloat16"
  device: "auto"
